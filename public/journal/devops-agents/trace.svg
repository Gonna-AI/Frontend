<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-label="Trace for the question: why did CNC-07 alarm at 06:12">
  <defs>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0a0a0a; }
      .t { font-size: 13.5px; font-weight: 600; }
      .tool { font-size: 13px; fill: #4a4a4a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s { font-size: 12px; fill: #6b6b6b; }
      .axis { font-size: 11px; fill: #9a9a9a; }
      .grid { stroke: #ececec; stroke-width: 1; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="689" rx="24" fill="#fafafa" stroke="#e6e6e6"/>
  <text x="40" y="50" style="font-size:18px;font-weight:600">Trace · “Why did CNC-07 alarm at 06:12?”</text>
  <text x="40" y="74" class="s">bundle maintenance-rca 2026.11.2 · 4.8 s end to end · 9 sources cited</text>

  <!-- axis: x = 320 + 160 * seconds -->
  <g>
    <line x1="320" y1="104" x2="320" y2="620" class="grid"/><text x="320" y="98" class="axis" text-anchor="middle">0 s</text>
    <line x1="480" y1="104" x2="480" y2="620" class="grid"/><text x="480" y="98" class="axis" text-anchor="middle">1 s</text>
    <line x1="640" y1="104" x2="640" y2="620" class="grid"/><text x="640" y="98" class="axis" text-anchor="middle">2 s</text>
    <line x1="800" y1="104" x2="800" y2="620" class="grid"/><text x="800" y="98" class="axis" text-anchor="middle">3 s</text>
    <line x1="960" y1="104" x2="960" y2="620" class="grid"/><text x="960" y="98" class="axis" text-anchor="middle">4 s</text>
    <line x1="1120" y1="104" x2="1120" y2="620" class="grid"/><text x="1120" y="98" class="axis" text-anchor="middle">5 s</text>
  </g>

  <!-- rows: 46px apart from y=124 -->
  <text x="40" y="134" class="t">request</text>
  <rect x="320" y="122" width="768" height="16" rx="5" fill="#0a0a0a"/>

  <text x="40" y="180" class="t">signal agent</text>
  <rect x="344" y="168" width="200" height="16" rx="5" fill="#3a3a3a"/>
  <text x="60" y="226" class="tool">query_historian</text>
  <rect x="352" y="214" width="144" height="16" rx="5" fill="#c8c8c8"/>
  <text x="506" y="227" class="s">OPC UA · 24 h · 7.8 mm/s RMS</text>

  <text x="40" y="272" class="t">manual agent</text>
  <rect x="344" y="260" width="312" height="16" rx="5" fill="#3a3a3a"/>
  <text x="60" y="318" class="tool">search_manuals</text>
  <rect x="360" y="306" width="216" height="16" rx="5" fill="#c8c8c8"/>
  <text x="586" y="319" class="s">Manual §4.3 · rev C · variant 07-S</text>

  <text x="40" y="364" class="t">history agent</text>
  <rect x="344" y="352" width="456" height="16" rx="5" fill="#3a3a3a" stroke="#ff4d00" stroke-width="2"/>
  <text x="812" y="365" class="s" style="fill:#b33600">slowest: work orders re-embedded per query (now cached)</text>
  <text x="60" y="410" class="tool">similar_incidents</text>
  <rect x="368" y="398" width="400" height="16" rx="5" fill="#c8c8c8"/>
  <text x="778" y="411" class="s">WO-1874 (Mar) · WO-1502 (Nov)</text>

  <text x="40" y="456" class="t">parts agent</text>
  <rect x="344" y="444" width="120" height="16" rx="5" fill="#3a3a3a"/>
  <text x="60" y="502" class="tool">check_stock</text>
  <rect x="352" y="490" width="80" height="16" rx="5" fill="#c8c8c8"/>
  <text x="442" y="503" class="s">SAP MM · 6205-2RS · bay B-12 · 4 in stock</text>

  <text x="40" y="548" class="t">planner</text>
  <rect x="816" y="536" width="256" height="16" rx="5" fill="#0a0a0a"/>
  <text x="60" y="594" class="tool">draft_work_order</text>
  <rect x="1008" y="582" width="48" height="16" rx="5" fill="#ff4d00"/>
  <text x="996" y="595" class="s" text-anchor="end" style="fill:#b33600">write tool · draft · approval required</text>

  <!-- legend -->
  <rect x="40" y="644" width="24" height="10" rx="3" fill="#3a3a3a"/><text x="72" y="653" class="s">agent step</text>
  <rect x="160" y="644" width="24" height="10" rx="3" fill="#c8c8c8"/><text x="192" y="653" class="s">tool call (read)</text>
  <rect x="300" y="644" width="24" height="10" rx="3" fill="#ff4d00"/><text x="332" y="653" class="s">tool call (draft write)</text>
</svg>
