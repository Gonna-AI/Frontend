name: Database backup

# The free Supabase plan keeps no backups. This dumps the production database every
# Sunday to a private Cloudflare R2 bucket (clerktree-backups, objects expire after 60 days).
#
# Repository secrets required:
#   SUPABASE_ACCESS_TOKEN   Supabase access token (account settings > access tokens)
#   CLOUDFLARE_API_TOKEN    Cloudflare API token with R2 edit permission
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare account id

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: cjknqlwfbfikipkmnvfo
  BUCKET: clerktree-backups

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dump schema and data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db dump -f schema.sql
          supabase db dump --data-only --use-copy --schema public,auth,storage -f data.sql
          tar -czf backup.tar.gz schema.sql data.sql
          size=$(stat -c %s backup.tar.gz)
          echo "backup size: $size bytes"
          # A near-empty archive means the dump silently failed.
          test "$size" -gt 2000

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          stamp=$(date -u +%Y-%m-%d)
          npx --yes wrangler@4 r2 object put "$BUCKET/db/$stamp.tar.gz" --file backup.tar.gz --remote
