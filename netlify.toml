[build]
  command = "npm run build"
  publish = "dist"

# Response headers (CSP, HSTS, caching) live in public/_headers.
# All redirects live here, in one file, because the first matching rule wins:
# specific rules first, the single-page-app fallback last.

[[redirects]]
  from = "/solutions"
  to = "/#solutions"
  status = 301
  force = true

[[redirects]]
  from = "/impressum"
  to = "/imprint"
  status = 301
  force = true

[[redirects]]
  from = "/crm"
  to = "https://crm.clerktree.com"
  status = 302
  force = true

[[redirects]]
  from = "/crm/*"
  to = "https://crm.clerktree.com/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/reddit-industrial-ai"
  to = "/"
  status = 301
  force = true

# Old product and template files: gone for good, so search engines drop them.
[[redirects]]
  from = "/callsumary.png"
  to = "/404"
  status = 410
  force = true

[[redirects]]
  from = "/graphofcalls.png"
  to = "/404"
  status = 410
  force = true

[[redirects]]
  from = "/graphofsimilarpeople.png"
  to = "/404"
  status = 410
  force = true

[[redirects]]
  from = "/cluster-copilot.png"
  to = "/404"
  status = 410
  force = true

[[redirects]]
  from = "/clusterrescueforhighrisk.png"
  to = "/404"
  status = 410
  force = true

[[redirects]]
  from = "/desktop1.png"
  to = "/404"
  status = 410
  force = true

[[redirects]]
  from = "/desktop3.png"
  to = "/404"
  status = 410
